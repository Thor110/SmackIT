; SmackIT settings. Put this file next to smackw32.dll (normally the game folder).
; Every setting is optional: delete a line, or the whole file, to use the default.

[SmackIT]
; 1 writes Smackw32_log.txt next to the DLL. Turn this on first when a game doesn't work.
Debug=0

; Replacement videos have the same name as the Smacker file with this extension:
; MOVIES\INTRO.SMK plays MOVIES\INTRO.mp4. Anything Media Foundation plays works (mp4, wmv, ...).
VideoExtension=mp4

; Optional folder checked first, by file name only (relative to the DLL's folder, or a full path).
; With VideoFolder=HD, MOVIES\INTRO.SMK plays HD\INTRO.mp4 when it exists.
VideoFolder=

; The game window is found automatically (the largest visible window of the game).
; Set the title and/or class name only if the video shows up over the wrong window.
WindowTitle=
WindowClass=

; -1 detects it (the game fills its monitor = fullscreen), 0 windowed, 1 fullscreen.
Fullscreen=-1

; 0 keeps the video's aspect ratio with black bars, 1 stretches it to fill the area.
Stretch=0

; 1 lets Escape, Space, Enter or a left click end a movie. Leave at 0 for games that already
; skip movies themselves, otherwise one key press may skip two movies.
SkipKeys=0

; 1 hides the mouse cursor while a movie plays.
HideCursor=1

; Video volume, 0 to 100.
Volume=100

; Position and size of the video inside the game window's client area, in pixels.
; 0 for Width / Height means the whole client area.
X=0
Y=0
Width=0
Height=0
